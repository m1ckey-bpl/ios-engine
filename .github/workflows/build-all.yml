name: Build Pioneer DSP (Android & iOS)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Android APK with Gradle
        working-directory: android
        run: |
          gradle assembleRelease --stacktrace

      - name: Locate and Rename APK
        run: |
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} Pioneer_DSP.apk \;
          ls -lh Pioneer_DSP.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pioneer-DSP-Android-APK
          path: Pioneer_DSP.apk

      - name: Publish Android & Windows Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.4.0
          name: "Pioneer DSP v2.4.0 (Aesthetic UI & Android APK)"
          body: |
            ## 🎵 Pioneer DSP v2.4.0 — Aesthetic UI & Performance Edition

            Now available with major upgrades based on user feedback!

            ### 📦 Direct Downloads:
            * 🤖 **Android**: `Pioneer_DSP.apk` (Direct install on Android phone, 100% free)
            * 🪟 **Windows**: `Pioneer_DSP_Windows.zip` (1-Click standalone desktop application)
            * 📱 **iOS**: `Pioneer_DSP_unsigned.ipa` (Sideloadable IPA)

            ### ✨ Key Improvements in v2.4.0:
            1. **Spotify Account Integration**: Direct login into Spotify account and in-app streaming with persistent cookie sessions.
            2. **Pure Vector Iconography**: Replaced all emojis with sleek hardware-grade SVG vectors.
            3. **Zero-Lag & Zero-Crash Optimization**: Removed canvas layout thrashing and continuous memory churn; added Android hardware layers and intent protection.
            4. **Persistent Music Library (IndexedDB)**: Songs saved to device storage permanently survive app restarts.
            5. **Real-Time Song Timer & Scrubber**: Live `00:00` timer and interactive seek slider.
            6. **Minimalist Hi-Fi Aesthetic**: Dark matte obsidian cockpit design with precision telemetry.
          files: |
            Pioneer_DSP.apk
            windows/Pioneer_DSP_Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile iOS Project
        run: |
          xcodebuild -project ios-engine.xcodeproj \
                     -scheme ios-engine \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     clean build

      - name: Package App into Unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ios-engine.app Payload/
          zip -r -y Pioneer_DSP_unsigned.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pioneer-DSP-Unsigned-IPA
          path: Pioneer_DSP_unsigned.ipa

      - name: Publish iOS Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.4.0
          files: Pioneer_DSP_unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
