name: Build Pioneer DSP (Android & iOS)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Android APK with Gradle
        working-directory: android
        run: |
          gradle assembleRelease --stacktrace

      - name: Locate and Rename APK
        run: |
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} Pioneer_DSP.apk \;
          ls -lh Pioneer_DSP.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pioneer-DSP-Android-APK
          path: Pioneer_DSP.apk

      - name: Publish Android & Windows Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.3.0
          name: "Pioneer DSP v2.3.0 (Android, Windows & iOS)"
          body: |
            ## 🎵 Pioneer DSP v2.3.0 — Cross-Platform Release

            Now available for **Android**, **Windows**, and **iOS**!

            ### 📦 Direct Downloads:
            * 🤖 **Android**: `Pioneer_DSP.apk` (Install directly on any Android phone, no certificates required!)
            * 🪟 **Windows**: `Pioneer_DSP_Windows.zip` (1-Click standalone desktop application!)
            * 📱 **iOS**: `Pioneer_DSP_unsigned.ipa` (Sideloadly / AltStore / TrollStore)

            ### ✨ Features:
            - **Real-Time 3D Concert Hall Reverb**
            - **10-Band Graphic Equalizer**
            - **Pioneer Todoroki Super Bass (+12dB)**
            - **Car Cabin Listening Position Alignment**
            - **Multi-Song Music Library Manager**
            - **Working Spotify Streamer & Companion**
            - **60fps Live Spectrum Visualizer**
          files: |
            Pioneer_DSP.apk
            windows/Pioneer_DSP_Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile iOS Project
        run: |
          xcodebuild -project ios-engine.xcodeproj \
                     -scheme ios-engine \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     clean build

      - name: Package App into Unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ios-engine.app Payload/
          zip -r -y Pioneer_DSP_unsigned.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pioneer-DSP-Unsigned-IPA
          path: Pioneer_DSP_unsigned.ipa

      - name: Publish iOS Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.3.0
          files: Pioneer_DSP_unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
