name: Build Pioneer DSP (Android & iOS)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Android APK with Gradle
        working-directory: android
        run: |
          gradle assembleRelease --stacktrace

      - name: Locate and Rename APK
        run: |
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} Pioneer_DSP.apk \;
          ls -lh Pioneer_DSP.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pioneer-DSP-Android-APK
          path: Pioneer_DSP.apk

      - name: Publish Android & Windows Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v3.2.0
          name: "Pioneer DSP v3.2.0 (Master Edition — Complete Music Player & DSP Engine)"
          body: |
            ## 🎵 Pioneer DSP v3.2.0 — Complete Android Music Player, Spotify Hub & DSP Engine

            ### 📦 Direct Downloads:
            * 🤖 **Android**: `Pioneer_DSP.apk` (Direct install on Android phone, 100% free)
            * 🪟 **Windows**: `Pioneer_DSP_Windows.zip` (1-Click standalone desktop application)
            * 📱 **iOS**: `Pioneer_DSP_unsigned.ipa` (Sideloadable IPA)

            ### 🚀 Highlights in Master Edition v3.2.0:
            1. **Fixed JSON & Spotify Errors**:
               - Handled HTTP 204 No Content without parsing empty JSON.
               - Defensive JSON parsing resolving `"Unexpected token 'C'... is not valid JSON"` issues.
               - Integrated Spotify Connect device discovery (`/v1/me/player/devices`) and active device transfer resolving `"Player command failed: No active device found"`.
            2. **Complete In-App Spotify Integration**:
               - In-app playback control dashboard (artwork, title, artist, play/pause, prev/next, seek bar, volume, shuffle, repeat).
               - Spotify device switcher chips.
               - Spotify live search for tracks & artists.
               - Personal playlists browsing and context playback.
            3. **Automatic Android MediaStore Music Discovery**:
               - Native MediaStore audio scanner querying `EXTERNAL_CONTENT_URI` with modern Android permissions (`READ_MEDIA_AUDIO` / `READ_EXTERNAL_STORAGE`).
               - Filter local tracks by Title, Artist, and Album with instant search.
            4. **Local Network Audio & HTTP/HTTPS Streaming**:
               - Direct streaming of local PC/NAS media servers and online HTTP/HTTPS streams.
               - Stream audio routes directly through the 10-band EQ, Todoroki Super Bass, and Reverb engine.
               - Curated lossless audiophile stream presets + custom saved streams list.
            5. **100% Removal of Demo Audio & Synthetic Chords**:
               - Removed all hardcoded synthetic demo songs and test math tones.
               - Clean, honest empty-state UI with 1-tap "Scan Device Audio".
            6. **Unified 9-Section Cockpit UI**:
               - Home, Spotify, Local Music, Network Music, Now Playing, Equalizer, Audio Effects, Presets, Settings.
               - Source indicator badge (`LOCAL AUDIO`, `NETWORK STREAM`, `SPOTIFY REMOTE`).
               - Full-screen Now Playing screen and persistent mini-dock.

            ### ✨ Major Capabilities in v3.0.0:
            1. **Legitimate Spotify PKCE OAuth & Web API Integration**:
               - Authorization Code Flow with PKCE (No client secret required).
               - User profile, subscription status, personal playlists browsing.
               - Remote playback controller (play, pause, next, prev, volume, track metadata).
               - Transparent policy disclosure regarding Spotify DRM and audio stream protections.
            2. **Professional Audio DSP Engine**:
               - 10-Band Graphic Equalizer (31Hz to 16kHz, -12dB to +12dB).
               - Todoroki Super Bass (63Hz) & Deep Sub-Bass (31Hz).
               - Preamp gain (-12dB to +12dB).
               - Midrange & Treble tone adjustments.
               - Peak Limiter (`DynamicsCompressor`) for guaranteed clipping protection.
               - 3 Convolution Ambience Modes (Concert Hall, Live Room, Studio) with wet/dry blend.
               - Stereo balance & Car Cabin time alignment (Driver, Passenger, Center, All Seats).
               - 10 Functional Factory Presets + User Custom Preset saving & loading.
            3. **Persistent Local Music Library**:
               - IndexedDB binary Blob storage retains imported songs permanently across device reboots.
               - High-precision 100ms playback timer & interactive scrubber.
            4. **Minimalist Luxury Hi-Fi Dark Cockpit UI**:
               - Pure SVG vector iconography.
               - Zero-lag 60fps spectrum visualizer with hardware acceleration.
          files: |
            Pioneer_DSP.apk
            windows/Pioneer_DSP_Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile iOS Project
        run: |
          xcodebuild -project ios-engine.xcodeproj \
                     -scheme ios-engine \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     clean build

      - name: Package App into Unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ios-engine.app Payload/
          zip -r -y Pioneer_DSP_unsigned.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pioneer-DSP-Unsigned-IPA
          path: Pioneer_DSP_unsigned.ipa

      - name: Publish iOS Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v3.2.0
          files: Pioneer_DSP_unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
