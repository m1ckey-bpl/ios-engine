name: Build Pioneer DSP (Android & iOS)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Android APK with Gradle
        working-directory: android
        run: |
          gradle assembleRelease --stacktrace

      - name: Locate and Rename APK
        run: |
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} Pioneer_DSP.apk \;
          ls -lh Pioneer_DSP.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pioneer-DSP-Android-APK
          path: Pioneer_DSP.apk

      - name: Publish Android & Windows Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v3.0.0
          name: "Pioneer DSP v3.0.0 (Master Edition — Audio DSP & Spotify PKCE)"
          body: |
            ## 🎵 Pioneer DSP v3.0.0 — Master Audio & Music DSP Application

            ### 📦 Direct Downloads:
            * 🤖 **Android**: `Pioneer_DSP.apk` (Direct install on Android phone, 100% free)
            * 🪟 **Windows**: `Pioneer_DSP_Windows.zip` (1-Click standalone desktop application)
            * 📱 **iOS**: `Pioneer_DSP_unsigned.ipa` (Sideloadable IPA)

            ### ✨ Major Capabilities in v3.0.0:
            1. **Legitimate Spotify PKCE OAuth & Web API Integration**:
               - Authorization Code Flow with PKCE (No client secret required).
               - User profile, subscription status, personal playlists browsing.
               - Remote playback controller (play, pause, next, prev, volume, track metadata).
               - Transparent policy disclosure regarding Spotify DRM and audio stream protections.
            2. **Professional Audio DSP Engine**:
               - 10-Band Graphic Equalizer (31Hz to 16kHz, -12dB to +12dB).
               - Todoroki Super Bass (63Hz) & Deep Sub-Bass (31Hz).
               - Preamp gain (-12dB to +12dB).
               - Midrange & Treble tone adjustments.
               - Peak Limiter (`DynamicsCompressor`) for guaranteed clipping protection.
               - 3 Convolution Ambience Modes (Concert Hall, Live Room, Studio) with wet/dry blend.
               - Stereo balance & Car Cabin time alignment (Driver, Passenger, Center, All Seats).
               - 10 Functional Factory Presets + User Custom Preset saving & loading.
            3. **Persistent Local Music Library**:
               - IndexedDB binary Blob storage retains imported songs permanently across device reboots.
               - High-precision 100ms playback timer & interactive scrubber.
            4. **Minimalist Luxury Hi-Fi Dark Cockpit UI**:
               - Pure SVG vector iconography.
               - Zero-lag 60fps spectrum visualizer with hardware acceleration.
          files: |
            Pioneer_DSP.apk
            windows/Pioneer_DSP_Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile iOS Project
        run: |
          xcodebuild -project ios-engine.xcodeproj \
                     -scheme ios-engine \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     clean build

      - name: Package App into Unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ios-engine.app Payload/
          zip -r -y Pioneer_DSP_unsigned.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pioneer-DSP-Unsigned-IPA
          path: Pioneer_DSP_unsigned.ipa

      - name: Publish iOS Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v3.0.0
          files: Pioneer_DSP_unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
