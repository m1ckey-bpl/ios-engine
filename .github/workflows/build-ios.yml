name: Build Pioneer DSP iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS Release IPA
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile iOS Project
        run: |
          xcodebuild -project ios-engine.xcodeproj \
                     -scheme ios-engine \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     clean build

      - name: Package App into Unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ios-engine.app Payload/
          zip -r -y Pioneer_DSP_unsigned.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pioneer-DSP-Unsigned-IPA
          path: Pioneer_DSP_unsigned.ipa

      - name: Publish iOS Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v4.1.0
          name: "Pioneer DSP for iOS v4.1.0 (YouTube Playback & LRCLIB Lyrics Edition)"
          body: |
            ## 🎵 Pioneer DSP for iOS v4.1.0 — YouTube Streaming & LRCLIB Lyrics Edition
            
            ### 📦 Download:
            * 📱 **iOS IPA**: `Pioneer_DSP_unsigned.ipa` (Sideload via AltStore / SideStore / Scarlet / TrollStore)

            ### ✨ Key Upgrades in this Release:
            1. **YouTube Music Discovery**:
               - Search YouTube tracks and metadata directly inside the Discovery & Library tab.
               - YouTube Data API v3 and high-speed public music gateway resolver.
            2. **Remote Command Center & Lock-Screen Media Controls**:
               - Integrated `MPRemoteCommandCenter` (Play, Pause, Skip, Previous, Seek).
               - Live `MPNowPlayingInfoCenter` telemetry with track metadata, elapsed time, and duration.
            3. **LRCLIB Synchronized Lyrics**:
               - Real-time lyrics lookup via LRCLIB API.
               - Synced lyric sheet with live scrolling and interactive timestamp seeking.
            4. **Real-Time 32-Bit Audio DSP Engine**:
               - 10-Band Graphic EQ, Concert Hall 3D spatial reverb, Todoroki Bass, and car cabin time alignment.
            
            *Note: For the Android APK, see our separate dedicated repository: [pioneer-dsp-android](https://github.com/m1ckey-bpl/pioneer-dsp-android)*
          files: Pioneer_DSP_unsigned.ipa
