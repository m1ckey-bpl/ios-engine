name: Build DSP ENGINE iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile iOS project
        run: |
          xcodebuild -project ios-engine.xcodeproj \
                     -scheme ios-engine \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     clean build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ios-engine.app Payload/
          zip -r -y DSP_ENGINE_unsigned.ipa Payload
          unzip -t DSP_ENGINE_unsigned.ipa

      - name: Upload iOS IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSP-ENGINE-Unsigned-IPA
          path: DSP_ENGINE_unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish iOS release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v5.0.1
          name: "DSP ENGINE for iOS v5.0.1"
          body: |
            ## DSP ENGINE for iOS — made by avx

            - DSP processing for compatible local, non-DRM audio files.
            - Real-time DSP for user-supplied, authorized direct HTTPS audio URLs; no audio is saved by the stream player.
            - YouTube Data API metadata search only. No embedded YouTube player, audio extraction, download, or MP3 conversion.
            - Spotify UI/service removed; protected third-party playback is not captured or processed.
            - The included IPA is unsigned and must be signed with a valid Apple identity/profile or a trusted sideloading workflow before installation.
          files: DSP_ENGINE_unsigned.ipa
