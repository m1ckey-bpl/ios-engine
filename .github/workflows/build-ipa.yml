name: Build Pioneer DSP IPA

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build Pioneer DSP Unsigned IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Xcode Version
        run: |
          xcodebuild -version

      - name: Compile Pioneer DSP Project (Code Signing Disabled)
        run: |
          xcodebuild -project ios-engine.xcodeproj \
                     -scheme ios-engine \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     clean build

      - name: Package App into Unsigned IPA
        run: |
          echo "Packaging Payload..."
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ios-engine.app Payload/
          zip -r -y Pioneer_DSP_unsigned.ipa Payload
          echo "IPA created successfully: $(ls -lh Pioneer_DSP_unsigned.ipa)"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pioneer-DSP-Unsigned-IPA
          path: Pioneer_DSP_unsigned.ipa
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0.0
          name: "Pioneer DSP v2.0.0 (Unsigned IPA)"
          body: |
            ## 🎵 Pioneer DSP v2.0.0 (Sound Tune Acoustic Engine)
            
            ### ✨ What's New:
            - **100% Free**: No license key, no lock screens, instant unrestricted access.
            - **Concert Hall Real-Time Reverb**: Instant 1-tap toggle to simulate 3D spatial acoustic concert hall acoustics.
            - **10-Band Graphic Equalizer**: Precision parametric frequency shaping from 31Hz to 16kHz.
            - **Super Bass (Todoroki)**: Pioneer signature rotary dial sub-bass booster (+12dB).
            - **Acoustic Reverb Studio**: Concert Hall, Large Arena, Cathedral, Live Studio, and Plate presets with wet/dry mix slider.
            - **Listening Position (Time Alignment)**: Interactive car cabin layout focusing acoustics on Driver, Passenger, or All Seats.
            - **Spotify Connect & Companion**: Quick launcher and companion tuning for Spotify.
            - **Audio File Importer**: Load any MP3, WAV, FLAC, or AAC from iOS Files with live DSP playback!
            - **Real-Time Spectrum Analyzer**: Bouncing 16-band LED frequency visualizer.
            
            ### 📱 Installation:
            Sideload this unsigned IPA using **Sideloadly**, **AltStore**, **ESign**, **Scarlet**, or **TrollStore**.
          files: Pioneer_DSP_unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
