name: Build Unsigned IPA

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build iOS Engine Unsigned IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Xcode Version
        run: |
          xcodebuild -version

      - name: Compile iOS Project (Code Signing Disabled)
        run: |
          xcodebuild -project ios-engine.xcodeproj                      -scheme ios-engine                      -configuration Release                      -destination 'generic/platform=iOS'                      -derivedDataPath build                      CODE_SIGNING_ALLOWED=NO                      CODE_SIGNING_REQUIRED=NO                      CODE_SIGN_IDENTITY=""                      clean build

      - name: Package App into Unsigned IPA
        run: |
          echo "Packaging Payload..."
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ios-engine.app Payload/
          zip -r -y iOS_Engine_unsigned.ipa Payload
          echo "IPA created successfully: $(ls -lh iOS_Engine_unsigned.ipa)"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Engine-Unsigned-IPA
          path: iOS_Engine_unsigned.ipa
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "iOS Engine v1.0.0 (Unsigned IPA)"
          body: |
            ## iOS Engine v1.0.0
            
            ### ✨ Features Included:
            - **Apple Liquid Glass Gaming UI**: Translucent frosted blur, specular highlights, glowing neon accents, animated background mesh.
            - **License Key System**:
              - HWID Device Binding (locks to customer's specific iPhone).
              - Live Real-time Countdown Timer display.
              - Instant Revoke / Terminate notifications.
              - Firebase Realtime Database & built-in offline test keys.
            - **File Manager Importer**: Native iOS Document Picker with SHA256 checksum and file analysis.
            - **Persistent Background Daemon**: Audio session keep-alive loop to prevent background suspension.
            
            ### 📱 How to Install:
            Sign this unsigned IPA using **Sideloadly**, **AltStore**, **ESign**, **Scarlet**, or **TrollStore**.
          files: iOS_Engine_unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
